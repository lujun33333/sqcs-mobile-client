name: Build mobile clients

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        options: [both, android, ios]
        default: both
      game_url:
        description: 默认登录网址（留空则首次启动填写；不要填账号或票据）
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name == 'push' || inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAME_URL: ${{ inputs.game_url || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run native -- android
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect APK and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/sqcs-android-debug.apk
          cd artifacts
          sha256sum sqcs-android-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sqcs-android-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  ios:
    if: github.event_name == 'push' || inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GAME_URL: ${{ inputs.game_url || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run native -- ios
      - name: Archive iOS app without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/SQCS.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned/Payload artifacts
          cp -R build/SQCS.xcarchive/Products/Applications/App.app build/unsigned/Payload/
          cd build/unsigned
          zip -qry ../../artifacts/sqcs-ios-unsigned.ipa Payload
          cd ../../artifacts
          shasum -a 256 sqcs-ios-unsigned.ipa > SHA256SUMS.txt
          printf '%s\n' 'Unsigned IPA: requires a valid signing certificate and provisioning profile before installation on an iPhone.' > SIGNING-REQUIRED.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sqcs-ios-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
